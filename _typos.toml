# Repo-local typos config, layered under the gate's qgate.typos.toml.
# Only names this repository cannot rename are listed; everything we own is spelled correctly instead.

[files]
extend-exclude = [
    # Unity TextMesh Pro package import (Unity Technologies), not our code.
    "AugaUnity/Assets/TextMesh Pro/",
    # UIGradient editor, Asset Store package by Josh H. (header of UIGradientEditor.cs).
    "AugaUnity/Assets/Editor/UIGradient/",
]

[default.extend-identifiers]
# Valheim 1.0.12 API (ValheimDecompiled-1.0.12/assembly_valheim):
PlayerCustomizaton = "PlayerCustomizaton"   # PlayerCustomizaton.cs:6
m_recipeDecription = "m_recipeDecription"   # InventoryGui.cs:117
m_canBeReparied = "m_canBeReparied"         # ItemDrop.cs:298
m_continousMusic = "m_continousMusic"       # Valheim.SettingsGui/AudioSettings.cs:31
m_equiped = "m_equiped"                     # InventoryElement field, HotkeyBar.cs:128
equiped = "equiped"                         # vanilla child path Find("equiped"), HotkeyBar.cs:128, VisEquipment.cs:1428
# Serialized field keys in AugaSettings.prefab (Unity YAML; stale, script no longer declares them, rewritten only by the Unity editor).
ConsoleAccessabilityTab = "ConsoleAccessabilityTab"
ConsoleAccessabilityPage = "ConsoleAccessabilityPage"
# GameObject names in AugaSettings.prefab mirrored from vanilla Settings; baked into the prebuilt augaassets bundle.
ChromaticAbberation = "ChromaticAbberation"
Vegitation = "Vegitation"
# Vanilla sprite name matched at runtime (Auga/AugaStyle.cs:12-16, runtime dump of FejdStartup/Settings).
BraidLineHorisontalMedium = "BraidLineHorisontalMedium"
# Sprite assets AugaUnity/Assets/Sprites/Buttons/Settigns*.png, packed in augaassets, looked up by name (Auga/AugaStyle.cs:99).
SettignsButtonOver = "SettignsButtonOver"
SettignsButtonUp = "SettignsButtonUp"
SettignsButtonDown = "SettignsButtonDown"
SettignsButtonDisabled = "SettignsButtonDisabled"
# Coffee.UIEffects UIFlip [SerializeField] name (vendored AugaUnityLib/UIFlip.cs:16); renaming drops serialized prefab values.
m_Veritical = "m_Veritical"
# Unity editor YAML serialization keys (generated by Unity, not editable).
m_EventTreshold = "m_EventTreshold"                 # AnimatorController transitions
m_DefaultMaxAngluarSpeed = "m_DefaultMaxAngluarSpeed" # ProjectSettings/DynamicsManager.asset
m_PVREnvironmentMIS = "m_PVREnvironmentMIS"         # scene LightmapSettings
ps4pnSessions = "ps4pnSessions"                     # ProjectSettings/ProjectSettings.asset
ps4pnPresence = "ps4pnPresence"
ps4pnFriends = "ps4pnFriends"
ps4pnGameCustomData = "ps4pnGameCustomData"
# Name quoted in upstream CHANGELOG entry (RandyKnapp/Auga commit 36e0f0e); historical record.
AugaTextsDialogeLore = "AugaTextsDialogeLore"

[default.extend-words]
# Surname in the Iron Gate credits list (AugaUnity/Assets/Prefabs/Credits.prefab).
hassel = "hassel"
